name: Validate Tech Art Skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install -r requirements-validation.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/scene_validator.py evals/fixtures/scene_clean.json --fail-on warning
      - run: python tools/scene_validator.py evals/fixtures/asset_validation_v2.json --schema-only
