name: Validate technical-art skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run validator tests
        run: python -m unittest discover -s tests -v
      - name: Validate clean fixture
        run: python tools/scene_validator.py evals/fixtures/scene_clean.json --fail-on warning
